  <body>
    <h3>Average of first n natural numbers</h3>
    <label>Enter a Number: </label>
    <input type="text" id="in1" />
    <button onclick="printNaturalNums()">Result</button> <br />
    <label>Result: </label>
    <input type="text" id="res1" readonly /> <br />

    <label>Enter a Number: </label>
    <input type="text" id="in2" />
    <button onclick="sumSquares()">Result</button> <br />

    <input type="text" id="res2" readonly /> <br />

    <label>Enter a Number: </label>
    <input type="text" id="in3" />
    <button onclick="sumCubes()">Result</button> <br />

    <label>Base: </label>
    <input type="text" id="base" /><br />
    <label>Power: </label>
    <input type="text" id="pow" />
    <button onclick="powerOfNum()">Result</button> <br />
    <label>Result: </label>
    <input type="text" id="res4" readonly /> <br />

    <button onclick="series3()">Result</button> <br />
